name: Documentation

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:
  # 仕様は ibis-ssl/specs からビルド時に取得するため、specs の更新に追従して再ビルドする
  repository_dispatch:
    types: [specs-updated]
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ibis-ssl/specs
          path: docs/specs
      - run: rm -rf docs/specs/.git docs/specs/.github
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical mdx_truly_sane_lists markdown-callouts
      - run: zensical build --clean
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
