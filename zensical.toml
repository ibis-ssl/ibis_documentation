[project]
site_url = "https://ibis-ssl.github.io/ibis_documentation/"
site_name = "ibis Documentation"
site_description = "RoboCup Soccer Small Size League チーム ibis の公開ドキュメント"
copyright = "Copyright &copy; 2024-2026 ibis-ssl"

repo_url = "https://github.com/ibis-ssl/ibis_documentation"
repo_name = "ibis-ssl/ibis_documentation"
edit_uri = "edit/main/docs/"

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]

[project.theme]
language = "ja"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/goal"
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Noto Sans JP"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "ライトモードに切り替え"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "ダークモードに切り替え"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "システム設定に従う"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://twitter.com/team_ibis"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ibis-ssl"

[project.plugins.search]

[project.plugins.tags]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.arithmatex.generic = true
pymdownx.betterem.smart_enable = "all"
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink.repo_url_shorthand = true
pymdownx.magiclink.user = "ibis-ssl"
pymdownx.magiclink.repo = "crane"
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
# docs/ai は 2 スペースインデントのリストで書かれているため必要
mdx_truly_sane_lists.nested_indent = 2
